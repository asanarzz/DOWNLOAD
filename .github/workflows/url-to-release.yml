name: Save links permanently

# لینک‌های مستقیمِ موقت (مثل لینک ۱۲ ساعته‌ی ربات‌های تلگرام) را می‌گیرد،
# فایل را دانلود می‌کند و در Release همین مخزن برای همیشه نگه می‌دارد.
# لینک دائمی هر فایل در پایان کار، در صفحه‌ی همین اجرا (Summary) نوشته می‌شود.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "لینک‌های مستقیم (چند تا را با فاصله یا ویرگول جدا کن)"
        required: true
        type: string
      tag:
        description: "اسم Release (پیش‌فرض files)"
        required: false
        default: files
        type: string

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      URLS: ${{ inputs.urls }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Prepare release
        run: |
          TAG="${TAG:-files}"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "Files"

      - name: Download and upload
        run: |
          cat > save.py <<'PY'
          import mimetypes, os, re, subprocess, sys, urllib.parse, urllib.request

          REPO = os.environ["REPO"]
          TAG = os.environ.get("TAG") or "files"
          LIMIT = 2 * 1024 ** 3 - 1024 * 1024  # GitHub: each file must be under 2 GiB
          urls = re.findall(r"https?://[^\s,]+", os.environ["URLS"])


          def safe_name(name):
              base, ext = os.path.splitext(name)
              base = re.sub(r"[^A-Za-z0-9._-]+", "_", base).strip("._") or "file"
              ext = re.sub(r"[^A-Za-z0-9.]", "", ext)
              return base + ext


          def pick_name(resp, url):
              cd = resp.headers.get("Content-Disposition", "")
              name = ""
              m = re.search(r"filename\*\s*=\s*(?:UTF-8'')?([^;]+)", cd, re.I)
              if m:
                  name = urllib.parse.unquote(m.group(1).strip().strip('"'))
              else:
                  m = re.search(r'filename\s*=\s*"?([^";]+)"?', cd, re.I)
                  if m:
                      name = urllib.parse.unquote(m.group(1).strip())
              if not name:
                  name = urllib.parse.unquote(os.path.basename(urllib.parse.urlparse(url).path))
              name = safe_name(name)
              if "." not in name:
                  ctype = resp.headers.get("Content-Type", "").split(";")[0].strip()
                  name += mimetypes.guess_extension(ctype) or ""
              return name


          os.makedirs("dl", exist_ok=True)
          used, results, failed = set(), [], []
          for i, url in enumerate(urls, 1):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      name = pick_name(resp, url)
                      if name in used:
                          name = f"{i}_{name}"
                      used.add(name)
                      total = int(resp.headers.get("Content-Length") or 0)
                      if total >= LIMIT:
                          print(f"SKIP {url}: larger than 2 GB")
                          failed.append(url)
                          continue
                      path = os.path.join("dl", name)
                      print(f"Downloading {name} ({total / 1e6:.0f} MB)", flush=True)
                      done, last = 0, -1
                      with open(path, "wb") as out:
                          while True:
                              chunk = resp.read(1024 * 1024)
                              if not chunk:
                                  break
                              out.write(chunk)
                              done += len(chunk)
                              if total:
                                  pct = int(done * 100 / total) // 10 * 10
                                  if pct != last:
                                      last = pct
                                      print(f"  {pct}%", flush=True)
                      if total and done < total:
                          raise RuntimeError("download was cut off")
                      if done == 0:
                          raise RuntimeError("empty file")
                      print("Uploading to release...", flush=True)
                      subprocess.run(["gh", "release", "upload", TAG, path, "--clobber", "--repo", REPO], check=True)
                      os.remove(path)
                      results.append(f"https://github.com/{REPO}/releases/download/{TAG}/{name}")
              except Exception as e:
                  print(f"FAILED {url}: {type(e).__name__}: {e}")
                  failed.append(url)

          lines = ["## Permanent links", ""] + [f"- {u}" for u in results]
          if failed:
              lines += ["", "## Failed", ""] + [f"- {x}" for x in failed]
          text = "\n".join(lines)
          print(text)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "summary.md"), "a") as f:
              f.write(text + "\n")
          if not urls or (failed and not results):
              sys.exit(1)
          PY
          python save.py
